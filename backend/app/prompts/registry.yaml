  learning.trajectory_analysis:
    description: "LLM 轨迹分析 — 从执行日志中提取深层经验教训"
    template: |
      分析以下任务执行轨迹，提取可复用的经验教训。

      任务: {task_description}
      执行结果: {success_status}
      Agent: {agent_id}

