      需求: {requirements}

      多 Agent 讨论记录:
      {transcript_text}

      请合并为一份结构化的需求分析报告，从以下角度分析:
      {analysis_angles}

      保留各 Agent 的独特视角和有价值的分歧点。

      如果讨论中 Agent 指出了需求信息缺失，请在报告末尾添加 "## 需要用户澄清" 章节，
      列出具体需要用户回答的问题（每个问题以 "- " 开头，以 "?" 结尾）。
      如果没有需要澄清的问题，则不添加此章节。
    variables:
