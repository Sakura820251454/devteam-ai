      {execution_logs}

      请从以下维度分析，用 JSON 格式输出：
      1. success_factors: 成功的关键因素（列表）
      2. pitfalls: 遇到的问题和陷阱（列表）
      3. key_decisions: 关键决策及其理由（列表）
      4. improvement_suggestions: 改进建议（列表）
      5. reusable_pattern: 可复用的模式描述（字符串，一句话）

      严格按 JSON 格式输出，不要输出其他内容。
      {{
        "success_factors": ["..."],
        "pitfalls": ["..."],
        "key_decisions": ["决策: 理由"],
        "improvement_suggestions": ["..."],
        "reusable_pattern": "..."
      }}
    variables:
      - name: task_description
      - name: success_status
      - name: agent_id
      - name: execution_logs
    output_format: json
    source_file: backend/app/services/collaboration/pipeline_orchestrator.py:_trigger_learning_cycle

  learning.soul_optimization:
    description: "soul 优化建议 — 发现 Agent 反复犯错时生成优化建议"
    template: |
      分析 Agent "{agent_name}" 的执行记录，判断是否需要优化其行为准则。

      近期执行记录:
      {recent_trajectories}

      已有 soul.md 核心规则摘要:
      {soul_summary}

      如果发现反复出现的问题模式，生成优化建议。如果没有明显问题，返回空列表。

      严格按 JSON 格式输出：
      {{
        "needs_optimization": true/false,
        "issues_found": ["问题1", "问题2"],
        "suggestions": [
          {{
            "section": "soul.md 中应修改的章节",
            "current": "当前规则（如有）",
            "suggested": "建议的修改或新增规则",
            "reason": "为什么需要这个修改"
          }}
        ]
      }}
    variables:
      - name: agent_name
      - name: recent_trajectories
      - name: soul_summary
    output_format: json
    source_file: backend/app/services/collaboration/pipeline_orchestrator.py:_trigger_learning_cycle

  learning.skill_markdown:
    description: "SKILL.md 文件格式生成"
    template: |
      根据以下经验，生成一个标准的 SKILL.md 文件内容。

      经验标题: {title}
      经验描述: {description}
      分类: {category}
      关键步骤: {steps}
      成功因素: {success_factors}
      陷阱: {pitfalls}

      生成的 SKILL.md 应包含：
      1. 标题和简介
      2. 流程步骤（带编号）
      3. 检查清单（checkbox 格式）
      4. 常见陷阱

      直接输出 Markdown 内容，不要包裹在代码块中。
    variables:
      - name: title
      - name: description
      - name: category
      - name: steps
      - name: success_factors
      - name: pitfalls
    output_format: text
    source_file: backend/app/services/collaboration/pipeline_orchestrator.py:_trigger_learning_cycle
