  # ==========================================================================
  # Collaboration Module — pipeline_templates.py
  # ==========================================================================

  collaboration.pipeline_templates.adjustment_system:
    description: "Pipeline 阶段模板调整 system prompt"
    template: "你是一个项目规划专家。只输出 JSON，不要输出其他内容。"
    variables: []
    output_format: text
    source_file: backend/app/services/collaboration/pipeline_templates.py:suggest_stage_adjustments

  collaboration.pipeline_templates.adjustment:
    description: "Pipeline 阶段模板调整用户提示词"
    template: |
      你是一个项目规划专家。请分析以下项目需求，判断当前选择的 Pipeline 阶段模板是否合适，并提出调整建议。

      ## 项目信息
      - 项目名称: {project_name}
      - 项目描述: {project_description}
      - 当前模板: {template_name}（{template_description}）

      ## 当前阶段
      {current_stages}

      ## 分析要求
      1. 根据项目描述的复杂度和特点，判断当前阶段是否足够、是否有多余
      2. 如果阶段不足，建议新增哪些阶段
      3. 如果有多余阶段，建议移除哪些
      4. 阶段顺序是否需要调整
      5. 产出物是否和项目匹配

      ## 输出格式
      严格按以下 JSON 格式输出（不要输出其他内容）:
      {{
        "analysis": "简短的分析说明（1-2句话）",
        "recommended_strategy": "sequential|hierarchical|discussion|pipeline",
        "changes": {{
          "add": [{{"label": "阶段名", "description": "做什么", "expected_artifact": "产出物.md", "position": 0}}],
          "remove": ["stage_key_to_remove"],
          "reorder": [{{"key": "stage_key", "new_position": 0}}],
          "rename": [{{"key": "old_key", "new_label": "新阶段名"}}]
        }},
        "final_stages": [
          {{"key": "stage_key", "label": "阶段名", "description": "做什么", "expected_artifact": "产出物.md", "parallel_group": null}}
        ]
      }}

      注意:
      - 如果当前阶段完全合适，changes 各字段为空数组，final_stages 与当前一致
      - final_stages 应包含调整后的完整阶段列表（按正确顺序）
      - 阶段数量不宜过多（建议 3-8 个）
      - parallel_group 用于标记可并行执行的阶段组（字符串），无并行的设为 null
    variables:
      - name: project_name
      - name: project_description
      - name: template_name
      - name: template_description
      - name: current_stages
    output_format: json
    source_file: backend/app/services/collaboration/pipeline_templates.py:suggest_stage_adjustments

  # ==========================================================================
  # Collaboration Module — strategy_recommender.py
  # ==========================================================================

  collaboration.strategy_recommender.system:
    description: "策略推荐 system prompt"
    template: "你是一位项目管理专家。只输出 JSON。"
    variables: []
    output_format: text
    source_file: backend/app/services/collaboration/strategy_recommender.py:recommend

  collaboration.strategy_recommender.recommend:
    description: "策略推荐用户提示词"
    template: |
      你是一个项目管理专家。请根据以下信息，推荐最适合的团队协作策略。

      ## 项目信息
      - 名称: {project_name}
      - 描述: {project_description}
      - 需求: {requirements}

      ## 可用团队成员
      {agents_text}

      ## 可选策略
      1. **sequential** (顺序执行): 适合 1-2 人的简单任务，按阶段顺序执行，一人负责一个阶段
      2. **hierarchical** (层级委派): 适合 3+ 人的复杂项目，协调者拆解委派给工人执行，最后汇总
      3. **discussion** (圆桌讨论): 适合需要多视角碰撞的决策场景，Agent 集体讨论达成共识

      ## 分析要求
      - 考虑团队规模和角色覆盖
      - 考虑项目复杂度和任务类型
      - 考虑是否需要多视角（如技术选型、架构设计）

      ## 输出格式 (JSON)
      {{
        "recommended_strategy": "sequential|hierarchical|discussion",
        "confidence": 0.85,
        "reasoning": "详细分析说明",
        "suggested_coordinator": "agent_id 或 null (仅 hierarchical 需要)",
        "alternative_strategies": [
          {{"strategy": "sequential", "reason": "如果X的话也可以考虑..."}}
        ]
      }}
    variables:
      - name: project_name
      - name: project_description
      - name: requirements
      - name: agents_text
    output_format: json
    source_file: backend/app/services/collaboration/strategy_recommender.py:recommend

