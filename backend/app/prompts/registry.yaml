# DevTeam-AI Prompt Registry
# 所有 LLM prompt 的单一真相源。修改 prompt 请改这里，然后运行:
#   python scripts/prompt_doc_gen.py
# 变量使用 {var_name} 语法（Python str.format 风格）。

metadata:
  version: "1.0.0"
  updated: "2026-05-22"
  total_prompts: 50

prompts:
  # ==========================================================================
  # Agent Module — agent_executor.py
  # ==========================================================================

  agent.executor.plan_steps:
    description: "任务步骤规划用户提示词 — 将任务拆解为 3-8 个步骤，要求 JSON 输出"
    template: |
      请将以下任务分解为 3-8 个具体的执行步骤。每个步骤应独立可执行、有明确的产出。

      任务标题: {task_title}
      任务描述: {task_description}

      指导原则:
      - 每个步骤的预期产出(expected_output)必须是一个具体的文件（如 index.html, report.md）
      - 交付/发送类任务以文件产出为核心，而非"发送"、"确认"等描述性操作
      - 如需外部信息，规划"向用户确认"步骤，不编造数据

      请严格按以下 JSON 格式输出（不要输出其他内容）:
      {{
        "steps": [
          {{
            "name": "步骤名称",
            "description": "此步骤要做什么",
            "expected_output": "此步骤的预期产出"
          }}
        ]
      }}
    variables:
      - name: task_title
      - name: task_description
    output_format: json
    source_file: backend/app/services/agent/agent_executor.py:_plan_task_steps

  agent.executor.plan_steps_system:
    description: "任务步骤规划 system prompt — 含第一性原理"
    template: |
      你是一个任务规划专家。请将任务拆解为具体执行步骤。
      遵循第一性原理：选择最简单直接的完成路径。
      不要将简单任务复杂化。如果任务可以用单一操作完成，就保持单一操作。
      规划时如果发现有不确定的地方（方向、方案、内容、数据等），必须规划"向用户确认"步骤。
      从用户处获取信息永远比自行假设更快更准确。只输出 JSON。
    variables: []
    output_format: text
    source_file: backend/app/services/agent/agent_executor.py:_plan_task_steps

  agent.executor.step_prompt.first:
    description: "单步执行用户提示词 — 无前置步骤（第一个步骤）"
    template: |
      执行以下任务的第 {step_index}/{total_steps} 步:

      任务: {task_title}
      步骤: {step_name}
      步骤说明: {step_description}
      预期产出: {expected_output}

      这是第一个步骤，请从头开始执行。

      请将你的执行结果放在 markdown 代码块中（```html, ```python, ```css 等），
      这将自动保存为工作区文件。如果产出是文档/报告，请使用 ```markdown 代码块。

      ⚠️ 重要规则：
      1. 只要你对任务的任何方面不确定（方向、方案、内容、数据、风格、取舍等），
         必须使用 [ASK_USER] 向用户提问。从用户处获取信息是最快、最有效的方式。
      2. [ASK_USER] 格式: [ASK_USER]\n问题: <具体问题>\n上下文: <为什么需要问>
      3. 如果已有足够信息，直接完成并输出代码块。
    variables:
      - name: task_title
      - name: step_index
      - name: total_steps
      - name: step_name
      - name: step_description
      - name: expected_output
    output_format: text
    source_file: backend/app/services/agent/agent_executor.py:_build_step_prompt
    conditional: "split_from: agent.executor.step_prompt（accumulated_output 为空）"

  agent.executor.step_prompt.continue:
    description: "单步执行用户提示词 — 基于前置步骤继续（有 accumulated_output）"
    template: |
      执行以下任务的第 {step_index}/{total_steps} 步:

      任务: {task_title}
      步骤: {step_name}
      步骤说明: {step_description}
      预期产出: {expected_output}

      前序步骤已完成的工作:
      {accumulated_output}

      请基于以上已完成的工作，继续执行当前步骤。不要重复已完成的内容。

      请将你的执行结果放在 markdown 代码块中（```html, ```python, ```css 等），
      这将自动保存为工作区文件。如果产出是文档/报告，请使用 ```markdown 代码块。

      ⚠️ 重要规则：
      1. 只要你对任务的任何方面不确定（方向、方案、内容、数据、风格、取舍等），
         必须使用 [ASK_USER] 向用户提问。从用户处获取信息是最快、最有效的方式。
      2. [ASK_USER] 格式: [ASK_USER]\n问题: <具体问题>\n上下文: <为什么需要问>
      3. 如果已有足够信息，直接完成并输出代码块。
    variables:
      - name: task_title
      - name: step_index
      - name: total_steps
      - name: step_name
      - name: step_description
      - name: expected_output
      - name: accumulated_output
    output_format: text
    source_file: backend/app/services/agent/agent_executor.py:_build_step_prompt
    conditional: "split_from: agent.executor.step_prompt（accumulated_output 有值）"

  agent.executor.task_execution:
    description: "任务执行兜底用户提示词 — 无步骤规划时的完整执行 prompt"
    template: |
      请执行以下任务:

      {project_requirement}

      任务标题: {task_title}
      任务描述: {task_description}

      任务标签: {task_tags}

      {upstream_context}

      请根据任务描述和你的角色，完成任务并给出详细的执行结果。

      如果是编程类任务，请提供完整的代码实现。
      如果是设计类任务，请提供详细的方案说明。
      如果是分析类任务，请提供深入的分析报告。

      请确保：
      1. 严格按照任务描述执行
      2. 提供具体的执行方案
      3. 说明关键的决策依据
      4. 给出可能的改进建议

      执行完成后，请总结任务完成情况。

      **重要：** 如果你在任务执行中发现以下情况，请使用 [ASK_USER] 标记向用户提问：
      - 需求信息不完整导致无法继续
      - 缺少完成任务的必要素材或数据（如Logo、文案、图片、数据文件）
      - 有多种合理方案需要用户选择

      使用格式（严格遵守，不可修改标记和字段名）:
      [ASK_USER]
      问题: <具体、明确的问题>
      上下文: <为什么需要问这个问题>
      选项: <可选的选项列表，用逗号分隔；如果没有固定选项则省略此行>

      示例 1 — 缺少素材:
      [ASK_USER]
      问题: 需要提供什么风格的 Logo？请提供参考图或描述品牌调性。
      上下文: 当前任务是设计公司官网，但项目资料中没有 Logo 文件和品牌规范。

      示例 2 — 需要用户选择方案:
      [ASK_USER]
      问题: 技术栈选择哪种方案？
      上下文: 项目需求可以用两种技术路线实现，各有优劣。
      选项: React + Next.js（生态好，学习曲线平缓）, Vue + Nuxt（中文社区活跃，上手快）

      如果不需要向用户提问，不要输出 [ASK_USER] 标记，直接给出执行结果。
    variables:
      - name: project_requirement
      - name: task_title
      - name: task_description
      - name: task_tags
      - name: upstream_context
    output_format: text
    source_file: backend/app/services/agent/agent_executor.py:_build_task_execution_prompt

  agent.executor.upstream_manifest:
    description: "上游依赖任务产出物清单 — pull 模型：告知 agent 有哪些上游产出物可用"
    template: |
      ## 上游依赖任务产出物

      以下前置任务已完成，其产出物已保存到工作区中：

      {upstream_items}

      你可以使用以下工具按需查看这些产出物：
      - **list_files** — 列出工作区文件结构，了解有哪些文件
      - **read_file** — 读取你需要的上游文件内容
      - **search_content** — 在工作区文件中搜索特定内容

      请先了解工作区结构，再根据需要读取相关文件。
    variables:
      - name: upstream_items
    output_format: text
    source_file: backend/app/services/agent/agent_executor.py:_build_upstream_context

  agent.executor.fallback_system:
    description: "单步执行 / 兜底执行的回退 system prompt"
    template: "你是一个专业的团队成员，擅长完成各种任务。"
    variables: []
    output_format: text
    source_file: backend/app/services/agent/agent_executor.py:_fallback_single_execution

  agent.executor.feedback_context:
    description: "可执行反馈上下文 — 失败重试时注入的上下文（code-managed）"
    template: null
    variables: []
    output_format: text
    source_file: backend/app/services/agent/agent_executor.py:_build_feedback_context
    code_managed: true

  # ==========================================================================
  # Agent Module — agent_service.py (chat methods)
  # ==========================================================================

  agent.service.chat_fallback:
    description: "agent_chat 的回退 system prompt"
    template: "You are a helpful assistant."
    variables: []
    output_format: text
    source_file: backend/app/services/agent/agent_service.py:agent_chat

  agent.service.chat_stream_fallback:
    description: "agent_chat_stream 的回退 system prompt"
    template: "You are a helpful assistant."
    variables: []
    output_format: text
    source_file: backend/app/services/agent/agent_service.py:agent_chat_stream

  # ==========================================================================
  # Agent Module — Preset Template (agent_service.py)
  # 不预设具体角色——角色由 soul.md 定义，trait_service 动态分析。
  # 此模板仅作为 soul.md 不可用时的最小兜底。
  # ==========================================================================

  agent.template.generic:
    description: "通用开发团队成员兜底模板 — 不预设角色"
    template: |
      你是 DevTeam AI 团队的一员。

      保持简洁，直接解决问题。
      遇到问题先动手排查，排查不出来再用工具查找，实在找不到才问用户。
    variables: []
    output_format: text
    source_file: backend/app/services/agent/agent_service.py:get_preset_templates

  # ==========================================================================
  # Agent Module — agent_trait_service.py
  # ==========================================================================

  agent.trait.generate:
    description: "Agent 特质分析用户提示词 — 从 soul 定义提取结构化能力特征"
    template: |
      你是一位人力资源分析专家。请根据以下 Agent 的灵魂定义，提取结构化的能力特征。

      Agent 名称: {agent_name}

      ## 核心原则 (Core Principles)
      {principles}

      ## 执行规则 (Execution Rules)
      {rules}

      请严格按以下 JSON 格式输出（不要输出其他内容）:
      {{
        "role_label": "该Agent最适合的中文角色标签（如：数据分析师/统筹协调/内容撰写/技术实现/质量把控/创意策划/研究分析）",
        "skills": ["具体技能1", "具体技能2", "具体技能3"],
        "strength_areas": ["擅长领域1", "擅长领域2"],
        "collaboration_style": "分析型/务实型/主动型/严谨型",
        "communication_style": "简洁型/详细型",
        "summary": "一句话总结该Agent的特点和最擅长的任务类型"
      }}
    variables:
      - name: agent_name
      - name: principles
      - name: rules
    output_format: json
    source_file: backend/app/services/agent/agent_trait_service.py:_generate_trait

  agent.trait.generate_system:
    description: "Agent 特质分析 system prompt"
    template: "你是一位人力资源分析专家。只输出 JSON。"
    variables: []
    output_format: text
    source_file: backend/app/services/agent/agent_trait_service.py:_generate_trait

  # ==========================================================================
  # Task Module — task_analyzer.py (Step 2: 任务分析)
  # ==========================================================================

  task.analyze_system:
    description: "任务分析 system prompt"
    template: "你是一位任务分析专家。分析用户任务的结构化特征。只输出JSON。"
    variables: []
    output_format: text
    source_file: backend/app/services/task/task_analyzer.py:analyze

  task.analyze:
    description: "任务分析用户提示词 — 分析任务领域、类型、复杂度"
    template: |
      你是一位任务分析专家。请分析以下用户任务，输出结构化的分析结果。

      ## 任务描述
      {task_description}

      ## 分析要求

      ### 1. 任务领域
      判断该任务属于哪个领域：
      - 信息查询：事实查询、动态跟踪、知识检索、数据搜集
      - 分析研究：政策调研、学术研究、市场分析、技术预研
      - 文案写作：报告撰写、方案策划、翻译、内容创作
      - 软件开发：功能开发、架构设计、Bug修复、代码重构
      - 数据分析：数据清洗、统计建模、可视化、数据挖掘
      - 设计创意：UI设计、品牌设计、多媒体制作、创意策划
      - 其他领域：不属于以上分类的通用任务（请具体描述）

      ### 2. 任务类型（四种）
      - 探索研究型：信息收集→多维分析→形成结论（如调研、技术预研）
      - 执行交付型：明确需求→按步骤执行→交付产物（如开发、写作）
      - 决策分析型：多方案比较→评估优劣→做出选择（如技术选型、评审）
      - 创意产出型：发散构思→迭代打磨→成品交付（如设计、策划）
      当任务涵盖两种以上类型时，标记为"混合型"并在 sub_types 中列出。

      ### 3. 复杂度
      评估任务复杂度（低/中/高），考虑因素：知识广度、步骤数量、不确定程度。

      ### 4. 子领域拆解
      将任务拆解为 2-5 个子领域或维度。

      ## 输出格式 (JSON)
      {{
        "domain": "任务领域",
        "task_type": "探索研究型|执行交付型|决策分析型|创意产出型|混合型",
        "sub_types": [],
        "complexity": "低|中|高",
        "breakdown": ["子领域1", "子领域2"],
        "key_challenge": "关键挑战描述",
        "analysis_summary": "一句话分析摘要"
      }}
    variables:
      - name: task_description
    output_format: json
    source_file: backend/app/services/task/task_analyzer.py:analyze

  # ==========================================================================
  # Team Module — team_suggester.py (Step 3: 团队组建建议)
  # ==========================================================================

  team.build_suggestion_system:
    description: "团队组建建议 system prompt"
    template: "你是一位团队组建专家。根据任务特征和人格库，组建最合适的团队。只输出JSON。"
    variables: []
    output_format: text
    source_file: backend/app/services/team/team_suggester.py:suggest

  team.build_suggestion:
    description: "团队组建建议用户提示词 — 基于任务分析和 soul 池建议角色+策略"
    template: |
      你是一位团队组建专家。请根据任务分析结果和可用的人员人格库，建议最合适的团队配置。

      ## 任务分析结果
      - 领域: {domain}
      - 任务类型: {task_type}
      - 复杂度: {complexity}
      - 拆解维度: {breakdown}
      - 关键挑战: {key_challenge}

      ## 可用人格库
      以下是通过 soul.md 定义的可选 Agent 人格特征。每个 Agent 有独特的做事风格和思维方式。
      {soul_pool_text}

      ## 建议要求

      ### 1. 建议角色清单
      推荐 1-5 个角色。每个角色包含：
      - `role_name`: 角色名称（根据任务领域命名，如"数据分析师"、"方案统筹"、"内容撰写"）
      - `responsibilities`: 该角色的具体职责（2-3句话）
      - `required_capabilities`: 所需核心能力（3-5个）
      - `suggested_soul`: 建议匹配的人格名称（来自人格库，说明为什么此人格适合该角色）
      - `matching_reason`: 匹配理由
      - `priority`: "essential" | "recommended" | "optional"

      ### 2. 建议协作策略
      - `recommended`: 推荐策略（sequential/hierarchical/discussion）
      - `reasoning`: 策略选择理由
      - `alternatives`: 备选策略及理由

      ## 输出格式 (JSON)
      {{
        "team_name": "建议的团队名称",
        "roles": [
          {{
            "role_name": "角色名称",
            "responsibilities": "职责描述",
            "required_capabilities": ["能力1", "能力2", "能力3"],
            "suggested_soul": "人格名称",
            "matching_reason": "为什么选此人",
            "priority": "essential|recommended|optional"
          }}
        ],
        "strategy": {{
          "recommended": "sequential|hierarchical|discussion",
          "reasoning": "策略选择理由",
          "alternatives": [
            {{"strategy": "discussion", "reason": "备选理由"}}
          ]
        }},
        "overall_rationale": "整体团队配置理由"
      }}
    variables:
      - name: domain
      - name: task_type
      - name: complexity
      - name: breakdown
      - name: key_challenge
      - name: soul_pool_text
    output_format: json
    source_file: backend/app/services/team/team_suggester.py:suggest

  # ==========================================================================
  # Agent Module — agent.py model (build_system_prompt)
