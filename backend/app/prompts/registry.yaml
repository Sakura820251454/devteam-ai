  collaboration.pipeline.review:
    description: "审查用户提示词"
    template: |
      请审核以下已完成的任务:

      {tasks_summary}

      请从以下角度进行审核，并严格按下方 Markdown 格式输出:

      ## 审核结论
      **通过 / 需修改 / 不通过**（选择一个）

      ## 1. 完成度
      - 是否满足所有需求: （是/部分满足/未满足）
      - 具体说明: ...

      ## 2. 执行质量
      - 代码/内容质量: （优/良/中/差）
      - 具体问题: ...

      ## 3. 潜在风险
      - 列出隐患（没有则写"无"）

      ## 4. 改进建议
      - 列出具体可执行的改进项（每条以 "- " 开头）

      示例输出:
      ## 审核结论
      **需修改**

      ## 1. 完成度
      - 是否满足所有需求: 部分满足
      - 具体说明: 事件时间线已整理完成，但缺少事故责任方的分析

      ## 2. 执行质量
      - 代码/内容质量: 良
      - 具体问题: 引用来源未标注链接

      ## 3. 潜在风险
      - 部分数据来自非官方渠道，可能影响可信度

      ## 4. 改进建议
      - 补充事故责任方分析章节
      - 为所有数据来源添加原文链接
    variables:
