# DevTeam-AI Prompt Registry
# 所有 LLM prompt 的单一真相源。修改 prompt 请改这里，然后运行:
#   python scripts/prompt_doc_gen.py
# 变量使用 {var_name} 语法（Python str.format 风格）。

metadata:
  version: "1.0.0"
  updated: "2026-05-22"
  total_prompts: 50

prompts:
  # ==========================================================================
  # Agent Module — agent_executor.py
  # ==========================================================================

  agent.executor.plan_steps:
    description: "任务步骤规划用户提示词 — 将任务拆解为 3-8 个步骤，要求 JSON 输出"
    template: |
      请将以下任务分解为 3-8 个具体的执行步骤。每个步骤应独立可执行、有明确的产出。

      任务标题: {task_title}
      任务描述: {task_description}

      请严格按以下 JSON 格式输出（不要输出其他内容）:
      {{
        "steps": [
          {{
            "name": "步骤名称",
            "description": "此步骤要做什么",
            "expected_output": "此步骤的预期产出"
          }}
        ]
      }}
    variables:
      - name: task_title
      - name: task_description
    output_format: json
    source_file: backend/app/services/agent/agent_executor.py:_plan_task_steps

  agent.executor.plan_steps_system:
    description: "任务步骤规划 system prompt"
    template: "你是一个任务规划专家。请将复杂任务拆解为具体执行步骤。只输出 JSON。"
    variables: []
    output_format: text
    source_file: backend/app/services/agent/agent_executor.py:_plan_task_steps

  agent.executor.step_prompt.first:
    description: "单步执行用户提示词 — 无前置步骤（第一个步骤）"
    template: |
      执行以下任务的第 {step_index}/{total_steps} 步:

      任务: {task_title}
      步骤: {step_name}
      步骤说明: {step_description}
      预期产出: {expected_output}

      这是第一个步骤，请从头开始执行。
    variables:
      - name: task_title
      - name: step_index
      - name: total_steps
      - name: step_name
      - name: step_description
      - name: expected_output
    output_format: text
    source_file: backend/app/services/agent/agent_executor.py:_build_step_prompt
    conditional: "split_from: agent.executor.step_prompt（accumulated_output 为空）"

  agent.executor.step_prompt.continue:
    description: "单步执行用户提示词 — 基于前置步骤继续（有 accumulated_output）"
    template: |
      执行以下任务的第 {step_index}/{total_steps} 步:

      任务: {task_title}
      步骤: {step_name}
      步骤说明: {step_description}
      预期产出: {expected_output}

      前序步骤已完成的工作:
      {accumulated_output}

      请基于以上已完成的工作，继续执行当前步骤。不要重复已完成的内容。
    variables:
      - name: task_title
      - name: step_index
      - name: total_steps
      - name: step_name
      - name: step_description
      - name: expected_output
      - name: accumulated_output
    output_format: text
    source_file: backend/app/services/agent/agent_executor.py:_build_step_prompt
    conditional: "split_from: agent.executor.step_prompt（accumulated_output 有值）"

  agent.executor.task_execution:
    description: "任务执行兜底用户提示词 — 无步骤规划时的完整执行 prompt"
    template: |
      请执行以下任务:

      任务标题: {task_title}
      任务描述: {task_description}

      任务标签: {task_tags}

      请根据任务描述和你的角色，完成任务并给出详细的执行结果。

      如果需要编写代码，请提供完整的代码实现。
      如果需要设计架构，请提供详细的架构说明。
      如果需要分析问题，请提供深入的分析报告。

      请确保：
      1. 严格按照任务描述执行
      2. 提供具体的实现方案
      3. 说明关键的设计决策
      4. 给出可能的改进建议

      执行完成后，请总结任务完成情况。
    variables:
      - name: task_title
      - name: task_description
      - name: task_tags
    output_format: text
    source_file: backend/app/services/agent/agent_executor.py:_build_task_execution_prompt

  agent.executor.fallback_system:
    description: "单步执行 / 兜底执行的回退 system prompt"
    template: "你是一个专业的开发团队成员，擅长完成各种开发任务。"
    variables: []
    output_format: text
    source_file: backend/app/services/agent/agent_executor.py:_fallback_single_execution

  agent.executor.feedback_context:
    description: "可执行反馈上下文 — 失败重试时注入的上下文（code-managed）"
    template: null
    variables: []
    output_format: text
    source_file: backend/app/services/agent/agent_executor.py:_build_feedback_context
    code_managed: true

  # ==========================================================================
  # Agent Module — agent_service.py (chat methods)
  # ==========================================================================

  agent.service.chat_fallback:
    description: "agent_chat 的回退 system prompt"
    template: "You are a helpful assistant."
    variables: []
    output_format: text
    source_file: backend/app/services/agent/agent_service.py:agent_chat

  agent.service.chat_stream_fallback:
    description: "agent_chat_stream 的回退 system prompt"
    template: "You are a helpful assistant."
    variables: []
    output_format: text
    source_file: backend/app/services/agent/agent_service.py:agent_chat_stream

  # ==========================================================================
  # Agent Module — Preset Template (agent_service.py)
  # 不预设具体角色——角色由 soul.md 定义，trait_service 动态分析。
  # 此模板仅作为 soul.md 不可用时的最小兜底。
  # ==========================================================================

  agent.template.generic:
    description: "通用开发团队成员兜底模板 — 不预设角色"
    template: |
      你是 DevTeam AI 开发团队的一员。

      保持简洁，直接解决问题。
      遇到问题先动手排查，排查不出来再用工具查找，实在找不到才问用户。
    variables: []
    output_format: text
    source_file: backend/app/services/agent/agent_service.py:get_preset_templates

  # ==========================================================================
  # Agent Module — agent_trait_service.py
  # ==========================================================================

  agent.trait.generate:
    description: "Agent 特质分析用户提示词 — 从 soul 定义提取结构化能力特征"
    template: |
      你是一位人力资源分析专家。请根据以下 Agent 的灵魂定义，提取结构化的能力特征。

      Agent 名称: {agent_name}

      ## 核心原则 (Core Principles)
      {principles}

      ## 执行规则 (Execution Rules)
      {rules}

      请严格按以下 JSON 格式输出（不要输出其他内容）:
      {{
        "role_label": "该Agent最适合的中文角色标签（如：架构师/后端开发/前端开发/测试工程师/运维工程师/产品经理）",
        "skills": ["具体技能1", "具体技能2", "具体技能3"],
        "strength_areas": ["擅长领域1", "擅长领域2"],
        "collaboration_style": "分析型/务实型/主动型/严谨型",
        "communication_style": "简洁型/详细型",
        "summary": "一句话总结该Agent的特点和最擅长的任务类型"
      }}
    variables:
      - name: agent_name
      - name: principles
      - name: rules
    output_format: json
    source_file: backend/app/services/agent/agent_trait_service.py:_generate_trait

  agent.trait.generate_system:
    description: "Agent 特质分析 system prompt"
    template: "你是一位人力资源分析专家。只输出 JSON。"
    variables: []
    output_format: text
    source_file: backend/app/services/agent/agent_trait_service.py:_generate_trait

  # ==========================================================================
  # Agent Module — agent.py model (build_system_prompt)
  # ==========================================================================

  agent.model.intro:
    description: "Agent 动态 system prompt — 开篇（姓名/角色/性格）"
    template: "你是一个名为{name}的{role}，职称是{title}。\n性格特点：{personality}，沟通风格：{style}。"
    variables:
      - name: name
      - name: role
      - name: title
      - name: personality
      - name: style
    output_format: text
    source_file: backend/app/models/agent.py:build_system_prompt

  agent.model.backstory:
    description: "Agent 动态 system prompt — 背景（可选段）"
    template: "背景：{backstory}"
    variables:
      - name: backstory
    output_format: text
    source_file: backend/app/models/agent.py:build_system_prompt

  agent.model.skills:
    description: "Agent 动态 system prompt — 专业技能（可选段）"
    template: "专业技能：{skills_text}"
    variables:
      - name: skills_text
    output_format: text
    source_file: backend/app/models/agent.py:build_system_prompt

  agent.model.knowledge:
    description: "Agent 动态 system prompt — 知识领域（可选段）"
    template: "知识领域：{areas_text}"
    variables:
      - name: areas_text
    output_format: text
    source_file: backend/app/models/agent.py:build_system_prompt

  agent.model.footer:
    description: "Agent 动态 system prompt — 结尾"
    template: |
      你是开发团队的一员，与其他Agent协作完成开发任务。
      请保持你的性格特点和专业角色，用你的沟通风格进行交流。
    variables: []
    output_format: text
    source_file: backend/app/models/agent.py:build_system_prompt

  # ==========================================================================
  # Shared Module — soul_parser.py
  # ==========================================================================

  shared.soul.header:
    description: "soul_to_system_prompt — 标题"
    template: "# Agent Soul\n"
    variables: []
    output_format: text
    source_file: backend/app/services/shared/soul_parser.py:soul_to_system_prompt

  shared.soul.core_principles:
    description: "soul_to_system_prompt — Core Principles 段落（可选）"
    template: "## Core Principles\n{principles_lines}\n"
    variables:
      - name: principles_lines
    output_format: text
    source_file: backend/app/services/shared/soul_parser.py:soul_to_system_prompt

  shared.soul.execution_rules:
    description: "soul_to_system_prompt — Execution Rules 段落（可选）"
    template: "## Execution Rules\n{rules_lines}\n"
    variables:
      - name: rules_lines
    output_format: text
    source_file: backend/app/services/shared/soul_parser.py:soul_to_system_prompt

  shared.soul.fallback:
    description: "soul_to_system_prompt — 无灵魂数据时的回退"
    template: |
      # Agent Soul
      ## Core Principles
      - 你是 DevTeam AI 开发团队的一员。
      - 保持简洁，直接解决问题。
    variables: []
    output_format: text
    source_file: backend/app/services/shared/soul_parser.py:soul_to_system_prompt

  # ==========================================================================
  # Collaboration Module — pipeline_orchestrator.py
  # ==========================================================================

  collaboration.pipeline.requirement_analysis:
    description: "需求分析用户提示词 — 单 LLM 兜底方案"
    template: |
      请分析以下项目需求:

      项目名称: {project_name}
      项目描述: {project_description}
      需求内容: {requirements}

      请从以下角度进行分析:
      1. 需求完整性 - 是否清晰、无歧义
      2. 技术可行性 - 技术上是否可行
      3. 潜在风险 - 可能遇到的问题
      4. 改进建议 - 更好的实现方式
      5. 优先级建议 - 哪些是核心功能、哪些是辅助功能

      请给出详细分析报告。
    variables:
      - name: project_name
      - name: project_description
      - name: requirements
    output_format: text
    source_file: backend/app/services/collaboration/pipeline_orchestrator.py:_build_requirement_analysis_prompt

  collaboration.pipeline.requirement_analysis_system:
    description: "需求分析 system prompt"
    template: "你是一位资深产品经理，擅长深入分析需求，发现潜在问题和改进机会。"
    variables: []
    output_format: text
    source_file: backend/app/services/collaboration/pipeline_orchestrator.py:_single_llm_requirement_analysis

  collaboration.pipeline.merge_analysis_system:
    description: "多 Agent 讨论合并为需求分析报告 — system prompt"
    template: "你是一位资深产品经理。请将以下多 Agent 讨论合并为一份完整的需求分析报告。保留所有有价值的分歧和不同视角。"
    variables: []
    output_format: text
    source_file: backend/app/services/collaboration/pipeline_orchestrator.py:_merge_discussion_into_analysis

  collaboration.pipeline.merge_analysis:
    description: "多 Agent 讨论合并为需求分析报告 — 用户提示词"
    template: |
      项目: {project_name}
      描述: {project_description}
      需求: {requirements}

      多 Agent 讨论记录:
      {transcript_text}

      请合并为一份结构化的需求分析报告，包含:
      1. 需求完整性分析
      2. 技术可行性分析
      3. 潜在风险
      4. 改进建议
      5. 优先级建议

      保留各 Agent 的独特视角和有价值的分歧点。
    variables:
      - name: project_name
      - name: project_description
      - name: requirements
      - name: transcript_text
    output_format: text
    source_file: backend/app/services/collaboration/pipeline_orchestrator.py:_merge_discussion_into_analysis

  collaboration.pipeline.task_breakdown_system:
    description: "任务拆解 system prompt"
    template: |
      你是一位经验丰富的项目经理，擅长将复杂需求拆解为可执行的具体任务。
      每个任务应该:
      - 清晰明确、可独立完成
      - 有明确的验收标准
      - 合理的工作量估计
      - 明确的依赖关系

      请按以下JSON格式输出任务列表:
      {
        "tasks": [
          {
            "title": "任务标题",
            "description": "任务详细描述",
            "assigned_role": "后端开发/前端开发/架构师/测试",
            "priority": "high/medium/low",
            "phase": "design/development/testing",
            "dependencies": ["前置任务标题"],
            "acceptance_criteria": ["验收标准1", "验收标准2"],
            "required_skills": ["需要的技能1", "需要的技能2"]
          }
        ],
        "summary": "整体拆解说明"
      }

      required_skills 字段说明：列出执行此任务所需的具体技能，如"数据库设计"、"API开发"、"前端组件开发"、"测试用例设计"、"CI/CD配置"、"架构评审"、"性能优化"等。这会用于后续匹配最合适的Agent来执行。
    variables: []
    output_format: json
    source_file: backend/app/services/collaboration/pipeline_orchestrator.py:_stage_task_breakdown

  collaboration.pipeline.task_breakdown:
    description: "任务拆解用户提示词"
    template: |
      基于以下项目需求，请拆解具体任务:

      项目名称: {project_name}
      需求内容: {requirements}

      前期分析结果:
      {previous_analysis}

      可用团队成员:
      {agent_info}

      请拆解出具体可执行的任务列表。
    variables:
      - name: project_name
      - name: requirements
      - name: previous_analysis
      - name: agent_info
    output_format: json
    source_file: backend/app/services/collaboration/pipeline_orchestrator.py:_build_task_breakdown_prompt

  collaboration.pipeline.review_system:
    description: "审查 system prompt"
    template: "你是一位资深技术专家，擅长代码审查和质量把控。"
    variables: []
    output_format: text
    source_file: backend/app/services/collaboration/pipeline_orchestrator.py:_single_llm_review

  collaboration.pipeline.review:
    description: "审查用户提示词"
    template: |
      请审核以下已完成的任务:

      {tasks_summary}

      请从以下角度进行审核:
      1. 完成度 - 是否满足所有需求
      2. 代码质量 - 是否有明显问题
      3. 潜在风险 - 是否存在安全隐患
      4. 改进建议 - 如何进一步优化

      请给出审核报告和改进建议。
    variables:
      - name: tasks_summary
    output_format: text
    source_file: backend/app/services/collaboration/pipeline_orchestrator.py:_build_review_prompt

  collaboration.pipeline.merge_review_system:
    description: "多 Agent 审查合并 — system prompt"
    template: "你是一位资深技术专家。请将以下多 Agent 审查讨论合并为一份代码审查报告。"
    variables: []
    output_format: text
    source_file: backend/app/services/collaboration/pipeline_orchestrator.py:_merge_discussion_into_review

  collaboration.pipeline.merge_review:
    description: "多 Agent 审查合并 — 用户提示词"
    template: |
      已完成任务:
      {tasks_text}

      审查讨论记录:
      {transcript_text}

      请合并为一份结构化审查报告，包含:
      1. 完成度评估
      2. 代码质量
      3. 安全性
      4. 改进建议
    variables:
      - name: tasks_text
      - name: transcript_text
    output_format: text
    source_file: backend/app/services/collaboration/pipeline_orchestrator.py:_merge_discussion_into_review

  # ==========================================================================
  # Collaboration Module — discussion_orchestrator.py
  # ==========================================================================

  collaboration.discussion.agent_speak:
    description: "Agent 讨论发言用户提示词 — 主模板（不含最终轮次指令）"
    template: |
      ## 讨论主题
      {topic}

      ## 项目上下文
      {context_text}

      ## 你的角色
      - 名称: {agent_name}
      - 角色: {role_label}
      - 特质: {trait_summary}

      ## 讨论历史
      {history_text}

      ## 你的发言 (第 {current_round}/{max_rounds} 轮)
      请基于你的专业视角参与讨论。
      - 针对前面发言者的观点给出你的看法（赞同/补充/质疑）
      - 从你的角色和特质出发提供专业意见
      - 简洁直接，3-5句话即可
      {final_instruction}
    variables:
      - name: topic
      - name: context_text
      - name: agent_name
      - name: role_label
      - name: trait_summary
      - name: history_text
      - name: current_round
      - name: max_rounds
      - name: final_instruction
    output_format: text
    source_file: backend/app/services/collaboration/discussion_orchestrator.py:_build_agent_speak_prompt
    conditional: "final_instruction 变量：非最终轮次传入空字符串，最终轮次传入 '- **这是最后一轮，请明确表述你的最终立场或建议**'"

  collaboration.discussion.agent_speak_fallback_system:
    description: "Agent 发言讨论回退 system prompt"
    template: "你是一个开发团队成员。"
    variables: []
    output_format: text
    source_file: backend/app/services/collaboration/discussion_orchestrator.py:_agent_speak

  collaboration.discussion.consensus_check_system:
    description: "共识检查 system prompt"
    template: "你是一位会议记录员。分析以下讨论是否达成共识。只输出 JSON。"
    variables: []
    output_format: text
    source_file: backend/app/services/collaboration/discussion_orchestrator.py:_check_consensus

  collaboration.discussion.consensus_check:
    description: "共识检查用户提示词"
    template: |
      主题: {topic}

      各成员观点:
      {positions_text}

      请判断是否达成共识，按 JSON 格式输出:
      {{"consensus": true/false, "conclusion": "共识内容或分歧描述"}}
    variables:
      - name: topic
      - name: positions_text
    output_format: json
    source_file: backend/app/services/collaboration/discussion_orchestrator.py:_check_consensus

  collaboration.discussion.summarize_system:
    description: "讨论总结 system prompt"
    template: "你是一位会议记录员。请用 3-5 句话总结以下讨论的要点和结论。"
    variables: []
    output_format: text
    source_file: backend/app/services/collaboration/discussion_orchestrator.py:_summarize_discussion

  collaboration.discussion.summarize:
    description: "讨论总结用户提示词"
    template: "主题: {topic}\n\n讨论记录:\n{history}\n\n请总结要点和{conclusion_type}。"
    variables:
      - name: topic
      - name: history
      - name: conclusion_type
    output_format: text
    source_file: backend/app/services/collaboration/discussion_orchestrator.py:_summarize_discussion
    conditional: "conclusion_type 变量：'最终结论'（已达成共识）或 '可选方向'（未达成共识）"

  collaboration.discussion.election_system:
    description: "Coordinator 选举 system prompt"
    template: "你是一位项目管理专家。请根据候选人的发言选出最佳 coordinator。只输出 JSON。"
    variables: []
    output_format: text
    source_file: backend/app/services/collaboration/discussion_orchestrator.py:_make_election_decision

  collaboration.discussion.election:
    description: "Coordinator 选举用户提示词"
    template: |
      项目: {project_name}
      描述: {project_description}

      候选人:
      {agents_text}

      选举讨论记录:
      {speakers_text}

      请评估每位候选人在讨论中展现的领导力、项目管理能力和技术理解，
      选出一位最适合的 coordinator。按 JSON 格式输出:
      {{"elected_agent_id": "具体的agent_id", "reason": "选择理由"}}
    variables:
      - name: project_name
      - name: project_description
      - name: agents_text
      - name: speakers_text
    output_format: json
